name: WeeklyMealPlanner
options:
  bundleIdPrefix: com.maxwelltan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  WeeklyMealPlanner:
    type: application
    platform: iOS
    sources:
      - path: WeeklyMealPlanner
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxwelltan.WeeklyMealPlanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  WeeklyMealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeeklyMealPlannerUITests
    dependencies:
      - target: WeeklyMealPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxwelltan.WeeklyMealPlannerUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  WeeklyMealPlanner:
    build:
      targets:
        WeeklyMealPlanner: all
        WeeklyMealPlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeeklyMealPlannerUITests
    archive:
      config: Release
